<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-Чат | Зенит</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  :root { --bg: #f8fafc; --primary: #4f46e5; --text-main: #1e293b; --text-muted: #64748b; --bot-bg: #ffffff; --border: #e2e8f0; --input-bg: #ffffff; --sidebar-bg: #f1f5f9; --sidebar-hover: #e2e8f0; }
  [data-theme="dark"] { --bg: #0f172a; --primary: #6366f1; --text-main: #f8fafc; --text-muted: #94a3b8; --bot-bg: #1e293b; --border: #334155; --input-bg: #1e293b; --sidebar-bg: #0b1121; --sidebar-hover: #1e293b; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: background 0.3s; }
  
  .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); }
  .new-chat-btn { width: 100%; padding: 0.8rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; }
  .new-chat-btn:hover { background: #4338ca; }
  .chat-list { flex: 1; overflow-y: auto; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .chat-item { padding: 0.8rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
  .chat-item:hover { background: var(--sidebar-hover); }
  .chat-item.active { background: var(--primary); color: white; font-weight: 500; }
  
  .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--bot-bg); border-bottom: 1px solid var(--border); }
  .logo { font-weight: 600; font-size: 1.1rem; }
  .user-info { display: flex; align-items: center; gap: 1rem; }
  .theme-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; }
  .logout-btn { text-decoration: none; color: var(--text-muted); font-size: 0.9rem; }
  .logout-btn:hover { color: #ef4444; }
  
  .chat-box { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
  .msg-row { display: flex; align-items: flex-end; gap: 0.75rem; max-width: 85%; animation: slideUp 0.3s ease; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }
  .avatar { width: 36px; height: 36px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; background: var(--bot-bg); border: 1px solid var(--border); }
  .msg-row.user .avatar { background: var(--primary); color: white; border: none; }
  .msg { padding: 0.85rem 1.25rem; border-radius: 20px; line-height: 1.6; font-size: 0.95rem; }
  .user .msg { background: var(--primary); color: white; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .msg { background: var(--bot-bg); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  
  .input-area { padding: 1rem 2rem; background: var(--bot-bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; }
  .controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .search-btn { display: flex; align-items: center; justify-content: center; padding: 0 1rem; height: 36px; border: 2px solid var(--border); background: transparent; color: var(--text-muted); border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: 'Inter', sans-serif; font-size: 0.85rem; }
  .search-btn.active { background: #10b981; color: white; border-color: #10b981; }
  .draw-btn.active { background: #8b5cf6; color: white; border-color: #8b5cf6; }
  .input-row { display: flex; gap: 0.5rem; }
  input { flex: 1; padding: 0.85rem 1.25rem; border: 2px solid var(--border); border-radius: 24px; font-size: 1rem; outline: none; background: var(--input-bg); color: var(--text-main); }
  input:focus { border-color: var(--primary); }
  button.send-btn { padding: 0 1.5rem; height: 44px; background: var(--primary); color: white; border: none; border-radius: 24px; font-weight: 600; cursor: pointer; }
  button.send-btn:hover { background: #4338ca; }
  
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <button class="new-chat-btn" onclick="createNewChat()">➕ Новый чат</button>
  </div>
  <div class="chat-list" id="chatList"></div>
</div>
<div class="main-chat">
  <div class="header">
    <div class="logo">🤖 Зенит</div>
    <div class="user-info">
      <button class="theme-btn" id="themeToggle">🌙</button>
      <a href="/logout" class="logout-btn">Выйти</a>
    </div>
  </div>
  <div class="chat-box" id="chat"></div>
  <div class="input-area">
    <div class="controls">
      <button class="search-btn" id="searchToggle">🌐 Поиск: Выкл</button>
      <button class="search-btn draw-btn" id="drawToggle">🎨 Рисовать: Выкл</button>
    </div>
    <div class="input-row">
      <input id="input" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') send()">
      <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
    </div>
  </div>
</div>

<script>
// --- ЛОГИКА ТЕМЫ ---
const themeToggle = document.getElementById('themeToggle');
const currentTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', currentTheme);
themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
themeToggle.addEventListener('click', () => {
  const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
});

// --- ЛОГИКА ЧАТОВ ---
let currentChatId = null;
const chatList = document.getElementById('chatList');

async function loadChats() {
  const res = await fetch('/chats'); const chats = await res.json();
  chatList.innerHTML = '';
  chats.forEach(chat => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
    div.innerHTML = `💬 ${chat.title}`;
    div.onclick = () => selectChat(chat.id);
    chatList.appendChild(div);
  });
  if (!currentChatId && chats.length > 0) selectChat(chats[0].id);
}
async function createNewChat() {
  const res = await fetch('/chats', { method: 'POST' });
  const newChat = await res.json(); currentChatId = newChat.id;
  await loadChats(); await selectChat(currentChatId);
}
async function selectChat(id) {
  currentChatId = id; await loadChats();
  const chatBox = document.getElementById('chat'); chatBox.innerHTML = '';
  const res = await fetch(`/history/${id}`); const history = await res.json();
  if (history.length === 0) addMessage('Привет! Выбери режим и напиши что-нибудь.', 'bot');
  else history.forEach(msg => addMessage(msg.text, msg.role));
}

// --- ЛОГИКА КНОПОК ---
const searchToggle = document.getElementById('searchToggle');
let useSearch = false;
searchToggle.addEventListener('click', () => {
  useSearch = !useSearch;
  searchToggle.classList.toggle('active', useSearch);
  searchToggle.innerHTML = useSearch ? '🌐 Поиск: Вкл' : '🌐 Поиск: Выкл';
});

const drawToggle = document.getElementById('drawToggle');
let isDrawMode = false;
drawToggle.addEventListener('click', () => {
  isDrawMode = !isDrawMode;
  drawToggle.classList.toggle('active', isDrawMode);
  drawToggle.innerHTML = isDrawMode ? '🎨 Рисовать: Вкл' : '🎨 Рисовать: Выкл';
  
  // Отключаем поиск при включении рисования
  if (isDrawMode && useSearch) {
    useSearch = false;
    searchToggle.classList.remove('active');
    searchToggle.innerHTML = '🌐 Поиск: Выкл';
  }
});

// --- ЛОГИКА СООБЩЕНИЙ ---
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const btn = document.getElementById('sendBtn');

function addMessage(text, type) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + type;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = type === 'user' ? '👤' : '🤖';
  
  const msg = document.createElement('div');
  msg.className = 'msg';
  
  // Проверка на картинку
  const imgRegex = /!\[.*?\]\((.*?)\)/;
  const match = text.match(imgRegex);
  
  if (match && match[1]) {
    const imgUrl = match[1];
    const img = document.createElement('img');
    img.src = imgUrl;
    img.style.maxWidth = '100%';
    img.style.borderRadius = '12px';
    img.style.marginTop = '10px';
    
    const textBefore = text.split('![')[0];
    const p = document.createElement('p');
    p.textContent = textBefore;
    p.style.margin = '0 0 5px 0';
    
    msg.appendChild(p);
    msg.appendChild(img);
  } else {
    msg.textContent = text;
  }
  
  row.appendChild(avatar);
  row.appendChild(msg);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

async function send() {
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  input.value = ''; addMessage(text, 'user');
  btn.disabled = true; searchToggle.disabled = true; drawToggle.disabled = true;
  
  const loadingText = isDrawMode ? 'Рисую...' : (useSearch ? 'Ищу в интернете...' : 'Зенит думает...');
  const loadingRow = addMessage(loadingText, 'bot');
  
  try {
    const res = await fetch('/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
          message: text, 
          use_search: useSearch, 
          is_draw_mode: isDrawMode, 
          chat_id: currentChatId 
      })
    });
    const data = await res.json();
    chat.removeChild(loadingRow); addMessage(data.reply, 'bot');
    loadChats(); 
  } catch (e) {
    chat.removeChild(loadingRow); addMessage('Ошибка соединения.', 'bot');
  } finally {
    btn.disabled = false; searchToggle.disabled = false; drawToggle.disabled = false; input.focus();
  }
}

window.onload = loadChats;
</script>
</body>
</html>
