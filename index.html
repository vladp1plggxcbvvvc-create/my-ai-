<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой ИИ с поиском</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f7; }
  h2 { text-align: center; }
  .chat-box { background: #fff; border-radius: 12px; padding: 1rem; height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: .75rem; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .msg { padding: .6rem 1rem; border-radius: 12px; max-width: 85%; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: #007bff; color: #fff; align-self: flex-end; }
  .bot { background: #e9ecef; color: #212529; align-self: flex-start; }
  .input-area { display: flex; gap: .5rem; margin-top: 1rem; }
  input { flex: 1; padding: .75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  button { padding: .75rem 1.5rem; background: #28a745; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button:disabled { background: #6c757d; cursor: not-allowed; }
</style>
</head>
<body>
  <h2>🔍 ИИ-ассистент с поиском</h2>
  <div class="chat-box" id="chat"></div>
  <div class="input-area">
    <input id="input" placeholder="Спроси что-нибудь..." onkeydown="if(event.key==='Enter') send()">
    <button id="sendBtn" onclick="send()">Отправить</button>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const btn = document.getElementById('sendBtn');

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage(text, 'user');
  btn.disabled = true;
  addMessage('Ищу информацию...', 'bot');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    chat.removeChild(chat.lastChild);
    addMessage(data.reply, 'bot');
  } catch (e) {
    chat.removeChild(chat.lastChild);
    addMessage('Ошибка соединения с сервером.', 'bot');
  } finally {
    btn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
